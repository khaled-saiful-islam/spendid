name: spendid-prod

# Production stack. Fill in .env.production (see .env.example), then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Set SITE_ADDRESS to your domain for automatic HTTPS (camera and passkeys need HTTPS).

x-app: &app
  build:
    context: .
    dockerfile: docker/prod.Dockerfile
    target: node
  image: spendid-node:latest
  env_file: .env.production
  environment:
    NODE_ENV: production
  volumes:
    - receipts:/data/receipts
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: sh -c "pnpm --filter @spendid/db migrate && pnpm --filter @spendid/api run seed"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    command: pnpm --filter @spendid/api start
    healthcheck:
      # Database and Redis both answer (see /api/health).
      test: ["CMD", "node", "-e", "fetch('http://localhost:8601/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: pnpm --filter @spendid/worker start
    healthcheck:
      # The worker touches this file every 30s while Redis answers.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-alive').mtimeMs < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: web
    image: spendid-web:latest
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  receipts:
  caddy_data:
