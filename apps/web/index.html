<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0B0D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Spendid tells you what you can safely spend today. Log spending by voice, photo or text." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spendid" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Spendid</title>
    <script src="/theme.js"></script>
    <script src="/splash.js"></script>
    <style>
      /* The animated splash: continues from the phone's own splash (same colour, same coin),
         then hands over to the app. Shown only when html.splashing is set by /splash.js. */
      #splash { display: none; }
      .splashing #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
        justify-items: center; gap: 22px; background: #f6f3fc;
        animation: splash-giveup 0.3s 4s forwards;
      }
      [data-theme="dark"].splashing #splash { animation: splash-dark 0.5s 0.15s forwards, splash-giveup 0.3s 4s forwards; }
      #splash .coin { width: 112px; height: 112px; position: relative; animation: splash-pop 0.55s cubic-bezier(.34,1.56,.64,1) both; }
      #splash .coin svg { width: 100%; height: 100%; overflow: visible; }
      #splash .rim { transform-origin: 32px 32px; animation: splash-rim 0.7s 0.1s cubic-bezier(.22,1,.36,1) both; }
      #splash .s { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: splash-draw 0.6s 0.28s cubic-bezier(.65,0,.35,1) forwards; }
      #splash .glint { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
      #splash .glint::after {
        content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: -60%;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.65), transparent);
        transform: skewX(-18deg); animation: splash-glint 0.6s 0.85s ease-in-out forwards;
      }
      #splash .word { display: flex; font: 800 30px/1 "Bricolage Grotesque Variable", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; color: #2a1446; }
      [data-theme="dark"] #splash .word { color: #f2f3f5; }
      #splash .word span { opacity: 0; transform: translateY(10px); animation: splash-rise 0.4s cubic-bezier(.22,1,.36,1) forwards; }
      #splash.out { transition: opacity 0.35s ease, visibility 0s 0.35s; opacity: 0; visibility: hidden; }
      #splash.out .coin { transition: transform 0.35s cubic-bezier(.4,0,1,1); transform: scale(1.5); }
      @keyframes splash-pop { from { transform: scale(0.82); } to { transform: scale(1); } }
      @keyframes splash-rim { from { transform: rotate(-120deg); opacity: 0; } to { transform: rotate(0); opacity: 1; } }
      @keyframes splash-draw { from { opacity: 1; } to { opacity: 1; stroke-dashoffset: 0; } }
      @keyframes splash-glint { to { left: 130%; } }
      @keyframes splash-rise { to { opacity: 1; transform: none; } }
      @keyframes splash-dark { to { background: #0a0b0d; } }
      @keyframes splash-giveup { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
        #splash .s { stroke-dashoffset: 0; opacity: 1; }
        #splash .word span { opacity: 1; transform: none; }
        [data-theme="dark"].splashing #splash { animation: splash-giveup 0.3s 4s forwards; background: #0a0b0d; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="coin">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="30" fill="#FFB224" />
          <circle class="rim" cx="32" cy="32" r="23" fill="none" stroke="#2A1446" stroke-width="3" stroke-dasharray="2 5" opacity=".35" />
          <path class="s" pathLength="1" d="M40.5 23.5c-1.8-2.4-4.8-3.8-8.6-3.8-5 0-8.4 2.6-8.4 6.3 0 8.3 17.6 4.6 17.6 12.4 0 3.9-3.6 6.6-9 6.6-4.1 0-7.4-1.6-9.4-4.4" fill="none" stroke="#2A1446" stroke-width="5" stroke-linecap="round" />
        </svg>
        <div class="glint"></div>
      </div>
      <div class="word">
        <span style="animation-delay:.55s">S</span><span style="animation-delay:.6s">p</span><span style="animation-delay:.65s">e</span><span style="animation-delay:.7s">n</span><span style="animation-delay:.75s">d</span><span style="animation-delay:.8s">i</span><span style="animation-delay:.85s">d</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
