<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F3FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#170B26" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Spendid tells you what you can safely spend today. Log spending by voice, photo or text." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Spendid</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('spendid-theme')
        const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
